name: Check RSS Feeds

on:
  schedule:
    - cron: '0 9 * * 1' # Elke maandagochtend om 09:00
  workflow_dispatch: # Zorgt ervoor dat je het handmatig kunt starten

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install -g tsx

      - name: Run RSS validation script
        run: npx tsx scripts/check-rss.ts
