name: RSS Health Check

on:
  schedule:
    - cron: "0 6 * * *" # elke dag om 06:00
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx ts-node check-rss.ts
